name: Dependency vulnerabilities

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Swift and website dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install OSV-Scanner 2.7.0
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan locked dependencies
        run: ./scripts/audit.sh --format=json --all-packages --output-file="$RUNNER_TEMP/dependencies.json"
      - name: Upload vulnerability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-vulnerabilities
          path: ${{ runner.temp }}/dependencies.json
          if-no-files-found: warn
